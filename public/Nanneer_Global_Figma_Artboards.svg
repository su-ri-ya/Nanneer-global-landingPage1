<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6400 1200" width="6400" height="1200" style="background:#0F172A; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <style>
      .display-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 900; }
      .mono-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
      .body-text { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.08" />
    </filter>
    <linearGradient id="sky-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="wave-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Canvas Header -->
  <text x="80" y="70" fill="#FFFFFF" font-size="28" font-weight="900" class="display-title">NANNEER GLOBAL — OFFICIAL FIGMA ARTBOARDS &amp; DESIGN SYSTEM</text>
  <text x="80" y="105" fill="#94A8B6" font-size="14" class="mono-text">4 DESKTOP FRAMES (1440 × 900) · 12-COLUMN SWISS ARCHITECTURAL GRID · LIGHT BLUE THEME</text>

  <!-- ========================================== -->
  <!-- FRAME 1: HERO & 4 HEADACHES (X: 80, Y: 150) -->
  <!-- ========================================== -->
  <g id="Frame-1-Hero-Headaches" transform="translate(80, 150)">
    <!-- Artboard Background -->
    <rect width="1440" height="900" rx="16" fill="url(#wave-bg)" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Navbar -->
    <rect width="1440" height="72" fill="#FFFFFF" fill-opacity="0.95" stroke="#E0F2FE" stroke-width="1" />
    <circle cx="60" cy="36" r="14" fill="#0284C7" />
    <text x="85" y="42" fill="#0B2545" font-size="18" font-weight="900" class="display-title">NANNEER <tspan fill="#0284C7">GLOBAL</tspan></text>
    
    <text x="440" y="42" fill="#475569" font-size="13" font-weight="600">Why Nanneer</text>
    <text x="560" y="42" fill="#475569" font-size="13" font-weight="600">Our Approach</text>
    <text x="680" y="42" fill="#475569" font-size="13" font-weight="600">Performance</text>
    <text x="790" y="42" fill="#475569" font-size="13" font-weight="600">Contact</text>
    
    <rect x="1230" y="18" width="160" height="36" rx="18" fill="url(#sky-btn)" />
    <text x="1260" y="41" fill="#FFFFFF" font-size="12" font-weight="800">Discuss Your STP →</text>

    <!-- Upper Hero Content -->
    <rect x="60" y="125" width="28" height="3" rx="1.5" fill="#0284C7" />
    <text x="96" y="130" fill="#0369A1" font-size="11" class="mono-text">STP OPERATIONS &amp; MAINTENANCE FOR COMMERCIAL BUILDINGS</text>
    
    <text x="60" y="180" fill="#0B2545" font-size="44" font-weight="900" class="display-title">Your STP Is Running.</text>
    <text x="60" y="230" fill="#0B2545" font-size="44" font-weight="900" class="display-title">But Is It Delivering?</text>
    
    <text x="60" y="275" fill="#475569" font-size="14" class="body-text">We manage your STP 24×7 to maximize sewage treatment, recover reusable water,</text>
    <text x="60" y="297" fill="#475569" font-size="14" class="body-text">prevent operational failures, and keep every activity documented.</text>

    <text x="88" y="340" fill="#0B2545" font-size="13" font-weight="700">Not just manpower. Complete operational accountability.</text>
    <circle cx="72" cy="336" r="6" fill="#059669" />

    <rect x="60" y="375" width="180" height="46" rx="23" fill="url(#sky-btn)" />
    <text x="95" y="403" fill="#FFFFFF" font-size="13" font-weight="800">Discuss Your STP →</text>

    <rect x="255" y="375" width="180" height="46" rx="23" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="295" y="403" fill="#1E293B" font-size="13" font-weight="700">See Sample Report</text>

    <!-- Hero Plant Photo Box -->
    <rect x="760" y="130" width="620" height="340" rx="24" fill="#E2E8F0" stroke="#BAE6FD" stroke-width="2" />
    <text x="980" y="305" fill="#64748B" font-size="16" class="mono-text">[ STP Plant Clarifier Photo ]</text>
    <rect x="780" y="150" width="180" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.95" stroke="#BAE6FD" />
    <circle cx="795" cy="163" r="4" fill="#10B981" />
    <text x="806" y="167" fill="#0F172A" font-size="10" class="mono-text">STP Plant Operations · 24×7 Live</text>

    <!-- Lower Section: 4 Daily Headaches -->
    <line x1="60" y1="520" x2="1380" y2="520" stroke="#E0F2FE" stroke-width="1.5" />
    <rect x="700" y="550" width="40" height="3" rx="1.5" fill="#0284C7" />
    <text x="720" y="585" fill="#0B2545" font-size="24" font-weight="900" text-anchor="middle" class="display-title">Managing an STP Shouldn't Be a Daily Headache.</text>
    <text x="720" y="612" fill="#64748B" font-size="13" text-anchor="middle" class="body-text">You have enough responsibilities managing your building. Your STP should not require constant follow-ups.</text>

    <!-- 4 Cards -->
    <g transform="translate(60, 650)">
      <rect x="0" y="0" width="310" height="130" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="18" y="18" width="44" height="44" rx="10" fill="#F0F9FF" stroke="#BAE6FD" />
      <text x="74" y="38" fill="#0B2545" font-size="15" font-weight="800">Water Wastage</text>
      <text x="74" y="62" fill="#64748B" font-size="12">Treated water not fully</text>
      <text x="74" y="80" fill="#64748B" font-size="12">utilized.</text>

      <rect x="335" y="0" width="310" height="130" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="353" y="18" width="44" height="44" rx="10" fill="#F0F9FF" stroke="#BAE6FD" />
      <text x="409" y="38" fill="#0B2545" font-size="15" font-weight="800">Unexpected Incidents</text>
      <text x="409" y="62" fill="#64748B" font-size="12">Overflows, breakdowns and</text>
      <text x="409" y="80" fill="#64748B" font-size="12">complaints.</text>

      <rect x="670" y="0" width="310" height="130" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="688" y="18" width="44" height="44" rx="10" fill="#F0F9FF" stroke="#BAE6FD" />
      <text x="744" y="38" fill="#0B2545" font-size="15" font-weight="800">Poor Documentation</text>
      <text x="744" y="62" fill="#64748B" font-size="12">Incomplete logs and missing</text>
      <text x="744" y="80" fill="#64748B" font-size="12">records.</text>

      <rect x="1005" y="0" width="315" height="130" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="1023" y="18" width="44" height="44" rx="10" fill="#F0F9FF" stroke="#BAE6FD" />
      <text x="1079" y="38" fill="#0B2545" font-size="15" font-weight="800">Manpower Dependency</text>
      <text x="1079" y="62" fill="#64748B" font-size="12">Constant supervision and</text>
      <text x="1079" y="80" fill="#64748B" font-size="12">follow-ups.</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- FRAME 2: THE SOLUTION (X: 1600, Y: 150)     -->
  <!-- ========================================== -->
  <g id="Frame-2-Solution" transform="translate(1600, 150)">
    <rect width="1440" height="900" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

    <text x="720" y="90" fill="#0369A1" font-size="12" text-anchor="middle" class="mono-text">THE SOLUTION ————</text>
    <text x="720" y="135" fill="#0B2545" font-size="38" font-weight="900" text-anchor="middle" class="display-title">One Partner. Complete STP Responsibility.</text>
    <text x="720" y="170" fill="#64748B" font-size="14" text-anchor="middle" class="body-text">From operator deployment to water recovery and monthly reporting, we bring the essential elements of STP operations under one accountable service.</text>

    <!-- 3 Stacked Horizontal Rows -->
    <g transform="translate(220, 220)">
      <!-- Module 1 -->
      <rect x="0" y="0" width="1000" height="160" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="0" y="0" width="400" height="160" rx="20" fill="#E2E8F0" />
      <text x="130" y="85" fill="#64748B" font-size="13" class="mono-text">[ 24x7 Operator Photo ]</text>
      <rect x="440" y="45" width="60" height="60" rx="16" fill="#F0F9FF" stroke="#BAE6FD" />
      <text x="525" y="70" fill="#0B2545" font-size="22" font-weight="900" class="display-title">24×7 Plant Operations</text>
      <text x="525" y="100" fill="#64748B" font-size="13">Trained operators across three shifts, supported by defined SOPs, supervision, and preventive maintenance.</text>

      <!-- Module 2 -->
      <rect x="0" y="190" width="1000" height="160" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="0" y="190" width="400" height="160" rx="20" fill="#E2E8F0" />
      <text x="130" y="275" fill="#64748B" font-size="13" class="mono-text">[ Water Reuse Weir Photo ]</text>
      <rect x="440" y="235" width="60" height="60" rx="16" fill="#F0F9FF" stroke="#BAE6FD" />
      <text x="525" y="260" fill="#0B2545" font-size="22" font-weight="900" class="display-title">Maximum Water Recovery</text>
      <text x="525" y="290" fill="#64748B" font-size="13">Measure, treat, and maximize safe reuse of wastewater for cooling towers, toilet flushing, and gardening.</text>

      <!-- Module 3 -->
      <rect x="0" y="380" width="1000" height="160" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="0" y="380" width="400" height="160" rx="20" fill="#E2E8F0" />
      <text x="120" y="465" fill="#64748B" font-size="13" class="mono-text">[ Digital SCADA Dashboard ]</text>
      <rect x="440" y="425" width="60" height="60" rx="16" fill="#F0F9FF" stroke="#BAE6FD" />
      <text x="525" y="450" fill="#0B2545" font-size="22" font-weight="900" class="display-title">Digital Monitoring &amp; Accountability</text>
      <text x="525" y="480" fill="#64748B" font-size="13">Track water quantity, quality, tank levels, equipment health, and scheduled activities with documented evidence.</text>
    </g>

    <rect x="620" y="800" width="200" height="48" rx="24" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <text x="660" y="830" fill="#0284C7" font-size="13" font-weight="800">Discuss Your STP →</text>
  </g>

  <!-- ========================================== -->
  <!-- FRAME 3: PERFORMANCE (X: 3120, Y: 150)      -->
  <!-- ========================================== -->
  <g id="Frame-3-Performance" transform="translate(3120, 150)">
    <rect width="1440" height="900" rx="16" fill="url(#wave-bg)" stroke="#E2E8F0" stroke-width="2" />

    <!-- Left Column -->
    <g transform="translate(80, 80)">
      <text x="0" y="20" fill="#0369A1" font-size="11" class="mono-text">STP OPERATIONS &amp; MAINTENANCE FOR COMMERCIAL BUILDINGS</text>
      <text x="0" y="65" fill="#0B2545" font-size="36" font-weight="900" class="display-title">Performance You Can Measure.</text>
      <text x="0" y="105" fill="#0B2545" font-size="36" font-weight="900" class="display-title">Operations You Can Verify.</text>
      <text x="0" y="145" fill="#64748B" font-size="13" class="body-text">We manage your STP 24×7 to maximize sewage treatment, recover reusable water, prevent operational failures, and keep every activity documented.</text>

      <!-- 3 Metrics -->
      <g transform="translate(0, 180)">
        <rect x="0" y="0" width="180" height="95" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="20" y="45" fill="#059669" font-size="26" font-weight="900">≥99%</text>
        <text x="20" y="70" fill="#1E293B" font-size="11" font-weight="700">Sewage Treatment Target</text>

        <rect x="195" y="0" width="180" height="95" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="215" y="45" fill="#059669" font-size="26" font-weight="900">≥99%</text>
        <text x="215" y="70" fill="#1E293B" font-size="11" font-weight="700">STP Availability Target</text>

        <rect x="390" y="0" width="180" height="95" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="410" y="45" fill="#059669" font-size="26" font-weight="900">≥99%</text>
        <text x="410" y="70" fill="#1E293B" font-size="11" font-weight="700">Manpower Coverage Target</text>
      </g>

      <text x="0" y="300" fill="#94A8B6" font-size="11" font-style="italic">Targets are subject to agreed operating conditions and contract scope.</text>

      <!-- Bottom Plant Photo -->
      <rect x="0" y="330" width="570" height="320" rx="20" fill="#E2E8F0" stroke="#BAE6FD" />
      <text x="180" y="500" fill="#64748B" font-size="14" class="mono-text">[ STP Clarification Basin Photo ]</text>
    </g>

    <!-- Right Column: Monthly Report Card -->
    <g transform="translate(740, 80)">
      <rect x="0" y="0" width="620" height="740" rx="24" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#card-shadow)" />
      <rect x="0" y="0" width="620" height="75" rx="24" fill="#0F2E47" />
      <text x="30" y="45" fill="#FFFFFF" font-size="20" font-weight="800">Monthly STP Performance Report</text>
      <text x="500" y="45" fill="#38BDF8" font-size="11" class="mono-text">NANNEER GLOBAL</text>
      
      <!-- Report Body Preview -->
      <rect x="25" y="100" width="270" height="150" rx="12" fill="#FAFDFE" stroke="#E2E8F0" />
      <text x="40" y="125" fill="#0B2545" font-size="13" font-weight="800">1. Water Balance (KLD)</text>
      <text x="40" y="155" fill="#64748B" font-size="12">Influent: 14,850 KLD</text>
      <text x="40" y="180" fill="#64748B" font-size="12">Treated Water: 14,713 KLD</text>
      <text x="40" y="210" fill="#059669" font-size="13" font-weight="800">Treatment &amp; Reuse: 99.0%</text>

      <rect x="325" y="100" width="270" height="150" rx="12" fill="#FAFDFE" stroke="#E2E8F0" />
      <text x="340" y="125" fill="#0B2545" font-size="13" font-weight="800">2. Water Quality (Avg.)</text>
      <text x="340" y="155" fill="#64748B" font-size="12">pH: 7.2 (Std: 6.5-8.5) ✓</text>
      <text x="340" y="180" fill="#64748B" font-size="12">BOD: 6 mg/L (Std: ≤10) ✓</text>
      <text x="340" y="205" fill="#64748B" font-size="12">COD: 28 mg/L (Std: ≤50) ✓</text>

      <rect x="25" y="270" width="270" height="150" rx="12" fill="#FAFDFE" stroke="#E2E8F0" />
      <text x="40" y="295" fill="#0B2545" font-size="13" font-weight="800">3. Equipment Performance</text>
      <text x="40" y="325" fill="#64748B" font-size="12">Feed Pumps: 99.6%</text>
      <text x="40" y="350" fill="#64748B" font-size="12">Aeration Blowers: 99.2%</text>
      <text x="40" y="380" fill="#0284C7" font-size="13" font-weight="800">Availability: 99.4%</text>

      <rect x="325" y="270" width="270" height="150" rx="12" fill="#FAFDFE" stroke="#E2E8F0" />
      <text x="340" y="295" fill="#0B2545" font-size="13" font-weight="800">4. Maintenance Records</text>
      <text x="340" y="325" fill="#64748B" font-size="12">Daily checks: 100% ✓</text>
      <text x="340" y="350" fill="#64748B" font-size="12">Weekly tasks: 100% ✓</text>
      <text x="340" y="375" fill="#059669" font-size="12">Unplanned Downtime: 0% ✓</text>

      <rect x="25" y="440" width="270" height="150" rx="12" fill="#FAFDFE" stroke="#E2E8F0" />
      <text x="40" y="465" fill="#0B2545" font-size="13" font-weight="800">5. Manpower Coverage</text>
      <text x="40" y="495" fill="#64748B" font-size="12">Shift A / B / C: 100%</text>
      <text x="40" y="525" fill="#0284C7" font-size="13" font-weight="800">Coverage: ≥99%</text>

      <rect x="325" y="440" width="270" height="150" rx="12" fill="#FAFDFE" stroke="#E2E8F0" />
      <text x="340" y="465" fill="#0B2545" font-size="13" font-weight="800">6. WhatsApp Evidence</text>
      <text x="340" y="495" fill="#64748B" font-size="12">Timestamped Videos &amp; Photos</text>
      <text x="340" y="525" fill="#059669" font-size="12">Daily Audit Trail ✓</text>

      <rect x="25" y="640" width="570" height="50" rx="25" fill="url(#sky-btn)" />
      <text x="180" y="672" fill="#FFFFFF" font-size="14" font-weight="800">View Sample Performance Report →</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- FRAME 4: CONTACT & ASSESSMENT (X: 4640)     -->
  <!-- ========================================== -->
  <g id="Frame-4-Contact" transform="translate(4640, 150)">
    <rect width="1440" height="900" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

    <!-- Left Side: Plant Photo -->
    <rect x="80" y="100" width="600" height="700" rx="24" fill="#E2E8F0" stroke="#BAE6FD" />
    <text x="260" y="460" fill="#64748B" font-size="16" class="mono-text">[ STP Aeration Facility Photo ]</text>
    <rect x="110" y="130" width="70" height="30" rx="10" fill="#FFFFFF" />
    <text x="130" y="151" fill="#0B2545" font-size="13" class="mono-text">STP</text>

    <!-- Right Side: Form Card -->
    <g transform="translate(740, 100)">
      <rect x="0" y="0" width="620" height="700" rx="24" fill="#F4F9FD" stroke="#E0F2FE" filter="url(#card-shadow)" />
      <rect x="40" y="40" width="6" height="35" rx="3" fill="#0284C7" />
      <text x="60" y="65" fill="#0B2545" font-size="28" font-weight="900" class="display-title">Is Your STP Performing</text>
      <text x="60" y="98" fill="#0B2545" font-size="28" font-weight="900" class="display-title">at Its Best?</text>
      <text x="60" y="135" fill="#64748B" font-size="13">Let's discuss your existing STP operations, water recovery potential, and opportunities.</text>

      <!-- Radio options -->
      <text x="60" y="190" fill="#0B2545" font-size="13" font-weight="800">Type of building</text>
      <rect x="60" y="210" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
      <text x="80" y="233" fill="#0284C7" font-size="12" font-weight="700">Commercial office / IT park</text>

      <rect x="315" y="210" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
      <text x="335" y="233" fill="#64748B" font-size="12">Hotel</text>

      <text x="60" y="290" fill="#0B2545" font-size="13" font-weight="800">STP capacity (optional)</text>
      <rect x="60" y="310" width="500" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" />
      <text x="80" y="336" fill="#94A8B6" font-size="12" class="mono-text">e.g. 250 KLD</text>

      <text x="60" y="395" fill="#0B2545" font-size="13" font-weight="800">What would you like to improve?</text>
      <rect x="60" y="415" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
      <text x="80" y="438" fill="#0284C7" font-size="12" font-weight="700">Overall STP performance</text>

      <rect x="315" y="415" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
      <text x="335" y="438" fill="#64748B" font-size="12">Treated water reuse</text>

      <rect x="60" y="520" width="370" height="52" rx="26" fill="url(#sky-btn)" />
      <text x="120" y="552" fill="#FFFFFF" font-size="14" font-weight="800">Discuss My STP Requirements →</text>

      <rect x="445" y="520" width="52" height="52" rx="14" fill="#FFFFFF" stroke="#CBD5E1" />
      <circle cx="471" cy="546" r="10" fill="#0284C7" />

      <rect x="510" y="520" width="52" height="52" rx="14" fill="#FFFFFF" stroke="#CBD5E1" />
      <circle cx="536" cy="546" r="10" fill="#25D366" />
    </g>
  </g>
</svg>