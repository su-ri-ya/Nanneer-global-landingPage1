<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 120" width="148" height="120">
  <defs>
    <filter id="meterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <g id="water-meter-device">
    <!-- Threaded Union Couplings & Tapered Necks (Zero External Pipes) -->
    
    <!-- Left Coupling Union Fitting -->
    <rect x="2" y="46" width="18" height="28" rx="1.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <line x1="11" y1="46" x2="11" y2="74" stroke="#E2E8F0" stroke-width="1" />
    <polygon points="20,50 20,70 38,66 38,54" fill="#1E293B" stroke="#0F172A" stroke-width="1" />

    <!-- Right Coupling Union Fitting -->
    <polygon points="110,54 110,66 128,70 128,50" fill="#1E293B" stroke="#0F172A" stroke-width="1" />
    <rect x="128" y="46" width="18" height="28" rx="1.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <line x1="137" y1="46" x2="137" y2="74" stroke="#E2E8F0" stroke-width="1" />

    <!-- Main Water Meter Housing -->
    <g id="meter-body" filter="url(#meterShadow)">
      <!-- Outer Perimeter Retaining Tabs (8 Lugs) -->
      <circle cx="114.5" cy="60.0" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
      <circle cx="102.6" cy="88.6" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
      <circle cx="74.0" cy="100.5" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
      <circle cx="45.4" cy="88.6" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
      <circle cx="33.5" cy="60.0" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
      <circle cx="45.4" cy="31.4" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
      <circle cx="74.0" cy="19.5" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
      <circle cx="102.6" cy="31.4" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />

      <!-- Main Outer Bezel Ring -->
      <circle cx="74" cy="60" r="41" fill="#DC2626" stroke="#991B1B" stroke-width="2.5" />

      <!-- Bottom Hinge Latch Bracket -->
      <g transform="translate(74, 60) rotate(35) translate(-74, -60)">
        <rect x="68" y="97" width="12" height="7" rx="1.5" fill="#DC2626" stroke="#991B1B" stroke-width="1.2" />
      </g>

      <!-- Inner Recessed Housing Well -->
      <circle cx="74" cy="60" r="37" fill="#991B1B" />
      <circle cx="74" cy="60" r="35.5" fill="#FFFFFF" />

      <!-- Fault Alert Halo Overlay -->
      
      <circle cx="74" cy="60" r="35.5" fill="#FEF2F2" opacity="0.4">
        
      <animate attributeName="opacity" values="0.25;0.75;0.25" dur="0.9s" repeatCount="indefinite" />
      </circle>

      <!-- Header Label -->
      <text x="74" y="43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="bold" fill="#1E293B" letter-spacing="0.4">WaterMeter</text>

      <!-- Digital Totalizer Roller Counter (Odometer Window) -->
      <g id="odometer-counter">
        <rect x="51" y="46" width="45.5" height="11.5" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.8" />
        <text x="63.5" y="54.5" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="7.2" font-weight="bold" fill="#0F172A" letter-spacing="1">03526</text>
        <line x1="76" y1="46" x2="76" y2="57.5" stroke="#CBD5E1" stroke-width="0.8" />
        <rect x="76.5" y="46.8" width="19.5" height="9.8" rx="0.5" fill="#FEF2F2" stroke="#EF4444" stroke-width="0.9" />
        <text x="86.2" y="54.5" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="7.2" font-weight="bold" fill="#DC2626" letter-spacing="0.8">987</text>
        <text x="101" y="55" font-family="Arial, Helvetica, sans-serif" font-size="5.2" font-weight="bold" fill="#1E293B">m³</text>
      </g>

      <!-- Technical Specifications & Calibration Stripes (Left) -->
      <g id="dial-spec-stripes">
        <line x1="46" y1="63" x2="62" y2="63" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
        <line x1="46" y1="66.5" x2="62" y2="66.5" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
        <line x1="46" y1="70" x2="59" y2="70" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
        <line x1="46" y1="73.5" x2="53" y2="73.5" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
        <rect x="54" y="79" width="4.5" height="3" fill="#1E293B" />
        <line x1="58.5" y1="80.5" x2="72" y2="80.5" stroke="#1E293B" stroke-width="1" />
      </g>

      <!-- Right Nominal Flow Rating Spec Block -->
      <rect x="91" y="63" width="7.5" height="3.2" fill="#1E293B" rx="0.4" />

      <!-- Rotary Flow Indicator Star Wheel (Central Impeller) -->
      <g id="flow-star-wheel" transform="translate(74.5, 67)">
        <g>
          
          <circle cx="0" cy="0" r="2.2" fill="#0F172A" />
          <path d="M 0 -5.5 C 1 -5.5, 1.8 -3.5, 0.8 -2 C 2.5 -2.5, 4.5 -1, 3.5 0.5 C 4.5 1.8, 3.2 3.8, 1.8 3 C 1.2 4.5, -0.8 5.2, -1.5 3.8 C -3 4.2, -4.5 2.5, -3.5 1 C -4.8 0.2, -4.5 -2, -3 -1.8 C -2.2 -3.5, -0.8 -5.5, 0 -5.5 Z" fill="#0F172A" />
        </g>
      </g>

      <!-- Analog Fractional Flow Sub-Dial Gauge -->
      <g id="analog-dial-gauge" transform="translate(86.5, 77.5)">
        <circle cx="0" cy="0" r="7.5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2" />
        <!-- Radial Scale Ticks -->
        <line x1="5.5" y1="0.0" x2="7.0" y2="0.0" stroke="#1E293B" stroke-width="0.7" />
        <line x1="4.4" y1="3.2" x2="5.7" y2="4.1" stroke="#1E293B" stroke-width="0.7" />
        <line x1="1.7" y1="5.2" x2="2.2" y2="6.7" stroke="#1E293B" stroke-width="0.7" />
        <line x1="-1.7" y1="5.2" x2="-2.2" y2="6.7" stroke="#1E293B" stroke-width="0.7" />
        <line x1="-4.4" y1="3.2" x2="-5.7" y2="4.1" stroke="#1E293B" stroke-width="0.7" />
        <line x1="-5.5" y1="0.0" x2="-7.0" y2="0.0" stroke="#1E293B" stroke-width="0.7" />
        <line x1="-4.4" y1="-3.2" x2="-5.7" y2="-4.1" stroke="#1E293B" stroke-width="0.7" />
        <line x1="-1.7" y1="-5.2" x2="-2.2" y2="-6.7" stroke="#1E293B" stroke-width="0.7" />
        <line x1="1.7" y1="-5.2" x2="2.2" y2="-6.7" stroke="#1E293B" stroke-width="0.7" />
        <line x1="4.4" y1="-3.2" x2="5.7" y2="-4.1" stroke="#1E293B" stroke-width="0.7" />
        <!-- Dynamic Needle -->
        <g>
          
          <line x1="0" y1="0" x2="2.5" y2="-4.2" stroke="#DC2626" stroke-width="1.2" stroke-linecap="round" />
          <circle cx="0" cy="0" r="1.4" fill="#DC2626" />
        </g>
      </g>

      <!-- Serial Barcode Stamp (Bottom Center) -->
      <g id="serial-barcode" transform="translate(74, 87)">
        <line x1="-8" y1="-2" x2="-8" y2="2" stroke="#1E293B" stroke-width="0.8" />
        <line x1="-6" y1="-2" x2="-6" y2="2" stroke="#1E293B" stroke-width="1.3" />
        <line x1="-4" y1="-2" x2="-4" y2="2" stroke="#1E293B" stroke-width="0.6" />
        <line x1="-2" y1="-2" x2="-2" y2="2" stroke="#1E293B" stroke-width="1.1" />
        <line x1="0" y1="-2" x2="0" y2="2" stroke="#1E293B" stroke-width="0.7" />
        <line x1="2" y1="-2" x2="2" y2="2" stroke="#1E293B" stroke-width="1.4" />
        <line x1="4.5" y1="-2" x2="4.5" y2="2" stroke="#1E293B" stroke-width="0.7" />
        <line x1="6.5" y1="-2" x2="6.5" y2="2" stroke="#1E293B" stroke-width="1.2" />
        <line x1="8" y1="-2" x2="8" y2="2" stroke="#1E293B" stroke-width="0.7" />
        <line x1="-8" y1="3.2" x2="8" y2="3.2" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="1 1.2" />
      </g>

      <!-- Optical Convex Glass Specular Glare Arc -->
      <path d="M 46 45 A 33 33 0 0 1 102 45" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.6" />
      <path d="M 50 49 A 28 28 0 0 1 98 49" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4" />

      
      <!-- Fault Alarm Badge -->
      <g transform="translate(74, 18)">
        <circle cx="0" cy="0" r="7" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.2">
          <animate attributeName="r" values="6.5;8;6.5" dur="0.8s" repeatCount="indefinite" />
        </circle>
        <text x="0" y="2.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">!</text>
      </g>
    </g>
  </g>
</svg>