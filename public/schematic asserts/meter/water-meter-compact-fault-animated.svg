<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="compactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <g transform="translate(48, 48)" filter="url(#compactShadow)">
    <!-- Top and Bottom Connection Stubs -->
    <rect x="-7" y="-46" width="14" height="8" fill="#1E293B" rx="1" />
    <rect x="-7" y="38" width="14" height="8" fill="#1E293B" rx="1" />

    <!-- 8 Lugs -->
    <circle cx="40.5" cy="0.0" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
    <circle cx="28.6" cy="28.6" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
    <circle cx="0.0" cy="40.5" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
    <circle cx="-28.6" cy="28.6" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
    <circle cx="-40.5" cy="0.0" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
    <circle cx="-28.6" cy="-28.6" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
    <circle cx="-0.0" cy="-40.5" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
    <circle cx="28.6" cy="-28.6" r="3.2" fill="#DC2626" stroke="#991B1B" stroke-width="1" />

    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="41" fill="#DC2626" stroke="#991B1B" stroke-width="2.5" />
    <circle cx="0" cy="0" r="37" fill="#991B1B" />
    <circle cx="0" cy="0" r="35.5" fill="#FFFFFF" />

    <!-- Header Label -->
    <text x="0" y="-17" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.2" font-weight="bold" fill="#1E293B">WaterMeter</text>

    <!-- Odometer Box -->
    <rect x="-23" y="-14" width="45.5" height="11.5" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.8" />
    <text x="-10.5" y="-5.5" text-anchor="middle" font-family="monospace" font-size="7.2" font-weight="bold" fill="#0F172A" letter-spacing="1">03526</text>
    <line x1="2" y1="-14" x2="2" y2="-2.5" stroke="#CBD5E1" stroke-width="0.8" />
    <rect x="2.5" y="-13.2" width="19.5" height="9.8" rx="0.5" fill="#FEF2F2" stroke="#EF4444" stroke-width="0.9" />
    <text x="12.2" y="-5.5" text-anchor="middle" font-family="monospace" font-size="7.2" font-weight="bold" fill="#DC2626" letter-spacing="0.8">987</text>
    <text x="27" y="-5" font-family="Arial, sans-serif" font-size="5.2" font-weight="bold" fill="#1E293B">m³</text>

    <!-- Stripes -->
    <line x1="-28" y1="3" x2="-12" y2="3" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
    <line x1="-28" y1="6.5" x2="-12" y2="6.5" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
    <line x1="-28" y1="10" x2="-15" y2="10" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
    <line x1="-28" y1="13.5" x2="-21" y2="13.5" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
    <rect x="-20" y="19" width="4.5" height="3" fill="#1E293B" />
    <line x1="-15.5" y1="20.5" x2="-2" y2="20.5" stroke="#1E293B" stroke-width="1" />
    <rect x="17" y="3" width="7.5" height="3.2" fill="#1E293B" rx="0.4" />

    <!-- Impeller Star -->
    <g transform="translate(0.5, 7)">
      <g>
        
        <circle cx="0" cy="0" r="2.2" fill="#0F172A" />
        <path d="M 0 -5.5 C 1 -5.5, 1.8 -3.5, 0.8 -2 C 2.5 -2.5, 4.5 -1, 3.5 0.5 C 4.5 1.8, 3.2 3.8, 1.8 3 C 1.2 4.5, -0.8 5.2, -1.5 3.8 C -3 4.2, -4.5 2.5, -3.5 1 C -4.8 0.2, -4.5 -2, -3 -1.8 C -2.2 -3.5, -0.8 -5.5, 0 -5.5 Z" fill="#0F172A" />
      </g>
    </g>

    <!-- Sub-Dial -->
    <g transform="translate(12.5, 17.5)">
      <circle cx="0" cy="0" r="7.5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2" />
      <g>
        
        <line x1="0" y1="0" x2="2.5" y2="-4.2" stroke="#DC2626" stroke-width="1.2" stroke-linecap="round" />
        <circle cx="0" cy="0" r="1.4" fill="#DC2626" />
      </g>
    </g>

    <!-- Barcode -->
    <g transform="translate(0, 27)">
      <line x1="-8" y1="-2" x2="-8" y2="2" stroke="#1E293B" stroke-width="0.8" />
      <line x1="-6" y1="-2" x2="-6" y2="2" stroke="#1E293B" stroke-width="1.3" />
      <line x1="-4" y1="-2" x2="-4" y2="2" stroke="#1E293B" stroke-width="0.6" />
      <line x1="-2" y1="-2" x2="-2" y2="2" stroke="#1E293B" stroke-width="1.1" />
      <line x1="0" y1="-2" x2="0" y2="2" stroke="#1E293B" stroke-width="0.7" />
      <line x1="2" y1="-2" x2="2" y2="2" stroke="#1E293B" stroke-width="1.4" />
      <line x1="4.5" y1="-2" x2="4.5" y2="2" stroke="#1E293B" stroke-width="0.7" />
      <line x1="6.5" y1="-2" x2="6.5" y2="2" stroke="#1E293B" stroke-width="1.2" />
      <line x1="8" y1="-2" x2="8" y2="2" stroke="#1E293B" stroke-width="0.7" />
      <line x1="-8" y1="3.2" x2="8" y2="3.2" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="1 1.2" />
    </g>

    <!-- Specular Glare -->
    <path d="M -28 -15 A 33 33 0 0 1 28 -15" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>
</svg>