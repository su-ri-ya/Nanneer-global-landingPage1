<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="ssPipeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.32" />
    </filter>
    <linearGradient id="ssPipeGradH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" /><stop offset="25%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#cbd5e1" /><stop offset="85%" stop-color="#94a3b8" /><stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Stainless Steel 316 Outer Casing (8px with 3D Drop Shadow) -->
  <path d="M 150 0 L 150 100 L 200 100" stroke="url(#ssPipeGradH)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#ssPipeShadow)"/>

  <!-- Process Fluid Core (5px) -->
  <path d="M 150 0 L 150 100 L 200 100" stroke="#8D6E63" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ANSI Flange Connection Collars -->
  <rect x="144.5" y="0" width="11" height="4" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.8"/>
  <rect x="196" y="94.5" width="4" height="11" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.8"/>
</svg>