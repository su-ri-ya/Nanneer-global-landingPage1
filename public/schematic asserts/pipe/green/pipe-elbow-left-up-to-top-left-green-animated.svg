<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes p-flow-anim {
        from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; }
      }
      .anim-p-flow {
        stroke-dasharray: 6 8;
        animation: p-flow-anim 0.8s linear infinite;
      }
    </style>
    <filter id="ssPipeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.32" />
    </filter>
    <linearGradient id="ssPipeGradH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" /><stop offset="25%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#cbd5e1" /><stop offset="85%" stop-color="#94a3b8" /><stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Stainless Steel 316 Outer Casing (8px with 3D Drop Shadow) -->
  <path d="M 48 0 L 48 48 L 0 48" stroke="url(#ssPipeGradH)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#ssPipeShadow)"/>

  <!-- Process Fluid Core (5px) -->
  <path d="M 48 0 L 48 48 L 0 48" stroke="#16A34A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Animated Fluid Flow Stream Dashes (2.5px) -->
  <path d="M 48 0 L 48 48 L 0 48" stroke="#BBF7D0" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" class="anim-p-flow"/>

  <!-- Directional Flow Arrow -->
  <polygon points="28,45 20,48 28,51" fill="#16A34A" />

  <!-- ANSI Flange Connection Collars -->
  <rect x="42.5" y="0" width="11" height="4" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.8"/>
  <rect x="0" y="42.5" width="4" height="11" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.8"/>
</svg>