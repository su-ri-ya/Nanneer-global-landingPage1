<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="metalRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="80%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="filterVesselGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="specularSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="sandMediaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="carbonMediaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="30%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="resinMediaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="mpvCasingGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="60%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </radialGradient>
    <radialGradient id="mpvDialGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </radialGradient>
    <radialGradient id="mpvBoltGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
  </defs>

  <g transform="translate(20, 20)" transform="rotate(-90 20 20)">
    <!-- Pipe Connection Flanges -->
    <rect x="-7" y="-17" width="14" height="3" rx="0.8" fill="url(#metalRingGrad)" stroke="#64748B" stroke-width="0.8" />
    <rect x="-7" y="14" width="14" height="3" rx="0.8" fill="url(#metalRingGrad)" stroke="#64748B" stroke-width="0.8" />

    <!-- ASME Twin Triangular Valve Body -->
    <polygon points="-7,-14 0,0 7,-14" fill="#334155" stroke="#0F172A" stroke-width="1.2" />
    <polygon points="-7,14 0,0 7,14" fill="#334155" stroke="#0F172A" stroke-width="1.2" />

    <!-- Center Valve Seat & Stem Boss -->
    <circle cx="0" cy="0" r="6.5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.3" />
    <circle cx="0" cy="0" r="2.2" fill="#16A34A" />

    <!-- Side Solenoid / Electric Actuator Head -->
    <line x1="0" y1="0" x2="-10" y2="0" stroke="#64748B" stroke-width="2" />
    <rect x="-19" y="-6" width="9" height="12" rx="1.5" fill="#1E293B" stroke="#16A34A" stroke-width="1" />
    <circle cx="-14.5" cy="0" r="1.5" fill="#22C55E" />
  </g>
</svg>